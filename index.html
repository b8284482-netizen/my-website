<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coin World 🪙</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
}


.start{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}


.start h1{
font-size:55px;
animation:up 1s ease;
}


.start p{
font-size:20px;
margin:25px;
line-height:2;
max-width:550px;
animation:up 1.5s ease;
}


button{
border:none;
cursor:pointer;
font-weight:bold;
transition:.3s;
}


.start button{
padding:18px 50px;
border-radius:40px;
font-size:20px;
background:white;
color:#243b55;
animation:up 2s ease;
}


button:hover{
transform:scale(1.1);
}



/* بازی */

.game{
display:none;
padding:30px;
}


.title{
text-align:center;
font-size:40px;
margin-bottom:30px;
}


.stats{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}


.box{
background:#ffffff20;
backdrop-filter:blur(10px);
padding:20px;
border-radius:20px;
width:150px;
text-align:center;
font-size:20px;
}



.play{
max-width:450px;
margin:40px auto;
padding:35px;
text-align:center;
background:#ffffff15;
border-radius:25px;
}


.play h2{
margin-bottom:25px;
}


.coinBtn{
padding:18px 45px;
border-radius:40px;
background:white;
color:#243b55;
font-size:20px;
}



.features{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}


.card{
background:#ffffff15;
padding:25px;
border-radius:20px;
width:200px;
text-align:center;
}



.coin{
position:fixed;
font-size:45px;
animation:coinMove 1s forwards;
pointer-events:none;
}



@keyframes up{

from{
opacity:0;
transform:translateY(80px);
}

to{
opacity:1;
transform:translateY(0);
}

}


@keyframes coinMove{

0%{
transform:translateY(0) scale(1);
opacity:1;
}

100%{
transform:translateY(-200px) scale(1.5);
opacity:0;
}

}

</style>

</head>


<body>


<div class="start" id="start">

<h1>
🪙 Coin World
</h1>

<p>
به دنیای سکه‌ها خوش آمدید!
سکه جمع کن، لول بالا ببر و قدرت خودت را بیشتر کن.
</p>


<button onclick="startGame()">
شروع بازی 🚀
</button>


</div>




<div class="game" id="game">


<div class="title">
🪙 Coin World
</div>



<div class="stats">


<div class="box">
🪙 سکه
<br>
<span id="coins">0</span>
</div>


<div class="box">
⭐ لول
<br>
<span id="level">1</span>
</div>


<div class="box">
⚡ انرژی
<br>
<span id="energy">100</span>
</div>


</div>



<div class="play">

<h2>
جمع کردن سکه
</h2>


<button class="coinBtn" onclick="getCoin()">
گرفتن سکه 🪙
</button>


</div>



<div class="features">


<div class="card">
🛒 فروشگاه
<br>
به زودی
</div>


<div class="card">
🎒 کیف
<br>
به زودی
</div>


<div class="card">
🏆 رکورد
<br>
به زودی
</div>


</div>


</div>




<script>


let coins = Number(localStorage.getItem("coins")) || 0;
let level = Number(localStorage.getItem("level")) || 1;
let energy = Number(localStorage.getItem("energy")) || 100;



function startGame(){

document.getElementById("start").style.display="none";

document.getElementById("game").style.display="block";

update();

}



function update(){

document.getElementById("coins").innerText=coins;

document.getElementById("level").innerText=level;

document.getElementById("energy").innerText=energy;

}



function getCoin(){


if(energy<=0){

alert("انرژی تموم شده!");

return;

}


coins++;
energy--;


if(coins % 10 === 0){

level++;

}



localStorage.setItem("coins",coins);
localStorage.setItem("level",level);
localStorage.setItem("energy",energy);


update();



let coin=document.createElement("div");

coin.className="coin";

coin.innerHTML="🪙";

coin.style.left=Math.random()*80+"%";
coin.style.top="60%";


document.body.appendChild(coin);



setTimeout(()=>{

coin.remove();

},1000);


}


</script>


</body>
</html>
